<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="横眉·鲁迅文化数字展馆——用户个人收藏页面。"
    >

    <title>
        我的收藏｜横眉·鲁迅文化数字展馆
    </title>

    <link
        rel="stylesheet"
        href="assets/css/reset.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/common.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/favorite.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/favorites.css"
    >
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
</head>

<body class="favorites-page">
    <header class="site-header">
        <div class="container header-inner">
            <a
                class="brand"
                href="index.html"
            >
                <span class="brand-seal">
                    横
                </span>

                <span class="brand-text">
                    <strong>横眉</strong>

                    <small>
                        鲁迅文化数字展馆
                    </small>
                </span>
            </a>

            <div class="header-tools">
                <nav
                    class="site-nav"
                    aria-label="主要导航"
                >
                    <a class="nav-link" href="index.html">
                        首页
                    </a>

                    <a class="nav-link" href="biography.html">
                        鲁迅生平
                    </a>

                    <a class="nav-link" href="works.html">
                        代表作品
                    </a>

                    <a class="nav-link" href="relations.html">
                        人物关系
                    </a>

                    <a class="nav-link" href="quotes.html">
                        经典语录
                    </a>

                    <a class="nav-link" href="history.html">
                        时代背景
                    </a>

                    <a class="nav-link" href="articles.html">
                        作品赏析
                    </a>

                    <a class="nav-link" href="gallery.html">
                        历史影像
                    </a>
                </nav>

                <div
                    class="account-actions"
                    data-auth-actions
                    aria-live="polite"
                >
                    <a
                        class="account-link"
                        href="auth.html"
                    >
                        登录 / 注册
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="favorites-main">
        <div class="container">
            <section class="favorites-heading" aria-labelledby="favorites-title">
                <div class="favorites-heading-copy">
                    <div class="favorites-kicker">
                        PRIVATE COLLECTION · NO. 11
                    </div>

                    <h1 class="favorites-title" id="favorites-title">
                        我的<span>收藏</span>
                    </h1>

                    <p class="favorites-description">
                        把阅读途中留下的作品、赏析与历史影像，收进一份可随时返回的私人档案。
                        已下架内容仍保留题名与分类记录。
                    </p>

                    <a class="favorites-profile-link" href="profile.html">
                        返回个人中心
                    </a>
                </div>

                <aside class="favorites-dossier" aria-label="收藏概览">
                    <span class="favorites-dossier-number" data-favorite-total>0</span>
                    <strong>件个人藏品</strong>
                    <p>登录账号专属 · 云端同步</p>

                    <dl class="favorites-type-summary">
                        <div>
                            <dt>作品</dt>
                            <dd data-favorite-type-count="works">0</dd>
                        </div>
                        <div>
                            <dt>赏析</dt>
                            <dd data-favorite-type-count="articles">0</dd>
                        </div>
                        <div>
                            <dt>影像</dt>
                            <dd data-favorite-type-count="gallery">0</dd>
                        </div>
                    </dl>
                </aside>
            </section>

            <section class="favorites-panel">
                <div class="favorites-toolbar">
                    <div class="favorites-toolbar-heading">
                        <span>COLLECTION INDEX</span>
                        <strong>藏品目录</strong>
                    </div>

                    <div
                        class="favorite-tabs"
                        aria-label="收藏分类"
                    >
                        <button
                            class="favorite-tab active"
                            type="button"
                            data-favorite-tab="all"
                            aria-pressed="true"
                        >
                            全部
                            <span
                                class="favorite-tab-count"
                                data-tab-count
                            >
                                0
                            </span>
                        </button>

                        <button
                            class="favorite-tab"
                            type="button"
                            data-favorite-tab="works"
                            aria-pressed="false"
                        >
                            代表作品
                            <span
                                class="favorite-tab-count"
                                data-tab-count
                            >
                                0
                            </span>
                        </button>

                        <button
                            class="favorite-tab"
                            type="button"
                            data-favorite-tab="articles"
                            aria-pressed="false"
                        >
                            作品赏析
                            <span
                                class="favorite-tab-count"
                                data-tab-count
                            >
                                0
                            </span>
                        </button>

                        <button
                            class="favorite-tab"
                            type="button"
                            data-favorite-tab="gallery"
                            aria-pressed="false"
                        >
                            历史影像
                            <span
                                class="favorite-tab-count"
                                data-tab-count
                            >
                                0
                            </span>
                        </button>
                    </div>

                    <div
                        class="favorites-source"
                        data-favorites-source
                        aria-live="polite"
                    >
                        正在连接个人云端档案
                    </div>
                </div>

                <div
                    class="favorites-grid"
                    data-favorites-grid
                    aria-live="polite"
                >
                    <div class="favorites-state">
                        <strong>
                            正在读取收藏
                        </strong>

                        <span>
                            请稍候……
                        </span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                © 2026 横眉·鲁迅文化数字展馆
                ·《数据技术实训》课程大作业
            </p>
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"
    ></script>

    <script
        type="module"
        src="assets/js/auth-state.js"
    ></script>

    <script
        type="module"
        src="assets/js/favorites-page.js"
    ></script>
</body>
</html>
